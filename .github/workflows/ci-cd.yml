name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gamefilter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest

  docker-build:
    name: Docker build
    needs: [frontend-quality, backend-quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: gamefilter-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: gamefilter-frontend:ci
          build-args: |
            VITE_SUPABASE_URL=https://example.supabase.co
            VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
            VITE_API_BASE_URL=

  publish-images:
    name: Publish Docker images
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push versioned images
        shell: bash
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          BACKEND="ghcr.io/$OWNER/gamefilter-backend"
          FRONTEND="ghcr.io/$OWNER/gamefilter-frontend"
          docker build -t "$BACKEND:${GITHUB_SHA}" -t "$BACKEND:latest" backend
          docker build \
            --build-arg VITE_SUPABASE_URL=https://example.supabase.co \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder \
            --build-arg VITE_API_BASE_URL= \
            -t "$FRONTEND:${GITHUB_SHA}" -t "$FRONTEND:latest" frontend
          docker push "$BACKEND:${GITHUB_SHA}"
          docker push "$BACKEND:latest"
          docker push "$FRONTEND:${GITHUB_SHA}"
          docker push "$FRONTEND:latest"

  deploy-production:
    name: Deploy production
    needs: [publish-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify deployment secrets
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID; do
            test -n "${!name}" || { echo "::error::Missing $name"; exit 1; }
          done
          test -n "${{ secrets.VERCEL_BACKEND_PROJECT_ID }}" || { echo "::error::Missing VERCEL_BACKEND_PROJECT_ID"; exit 1; }
          test -n "${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}" || { echo "::error::Missing VERCEL_FRONTEND_PROJECT_ID"; exit 1; }
          test -n "${{ secrets.VITE_SUPABASE_URL }}" || { echo "::error::Missing VITE_SUPABASE_URL"; exit 1; }
          test -n "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" || { echo "::error::Missing VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
      - run: npm install --global vercel@latest
      - name: Deploy FastAPI container
        id: backend
        working-directory: backend
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
        shell: bash
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          BACKEND_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "Backend: $BACKEND_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy React frontend
        working-directory: frontend
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          VITE_API_BASE_URL: ${{ steps.backend.outputs.url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          FRONTEND_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Frontend: $FRONTEND_URL" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --retry 5 --retry-delay 3 "$FRONTEND_URL" >/dev/null
          curl --fail --retry 5 --retry-delay 3 "${{ steps.backend.outputs.url }}/api/health" >/dev/null
